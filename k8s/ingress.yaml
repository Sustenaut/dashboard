# dashboard.sustenaut.eu through the server's shared Traefik, with a Let's Encrypt certificate
# (resolver "letsencrypt", shared-infra's infra/cloud-init). The name answers here once
# shared-infra's pubkit.json lists the site (hosting.sites.dashboard) and its apply has run.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: dashboard.sustenaut.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  name: http
  tls:
    - hosts:
        - dashboard.sustenaut.eu
