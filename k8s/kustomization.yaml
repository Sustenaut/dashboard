# The dashboard on the Sustenaut k3s server (shared-infra's infra/hetzner.tf), namespace
# dashboard: the app and the ingress for dashboard.sustenaut.eu. Rendered by
# .github/workflows/deploy.yml (pubdeploy's k8s-deploy.yml) with the image it just built and
# applied by sustenaut-deploy on the server. Not here (the deploy identity may not manage it):
# the Secret dashboard-secrets, which the deploy walk makes from Bitwarden (pubrules.json's deploy
# block, README.md "Deploying").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dashboard
resources:
  - service-accounts.yaml
  - app.yaml
  - ingress.yaml
images:
  - name: ghcr.io/sustenaut/dashboard
    newTag: unset
