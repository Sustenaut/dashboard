# Build and deploy the dashboard (dashboard.sustenaut.eu) once CI passes on a merge to main, or
# by hand, with pubdeploy's k8s-deploy.yml. The image goes to GitHub's container registry as
# ghcr.io/sustenaut/dashboard, public: it holds the bundled server, its CSS and fonts, and no key.
# Then k8s/, rendered with that image, goes to the Sustenaut k3s server over SSH and the
# tailnet, where the deploy key can only run sustenaut-deploy: apply in namespace dashboard and
# wait, once DEPLOY_DASHBOARD is on, which the deploy walk sets once every need before it is
# ready.
#
# Without SUSTENAUT_SERVER the image is built and pushed, and nothing is deployed.
name: deploy

on:
  # Once CI (main.yml) has passed on a merge to main, never beside it; k8s-deploy's
  # ready job also waits for the integrations check on that commit.
  workflow_run: { workflows: [main], types: [completed], branches: [main] }
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  deploy:
    uses: Sustenaut/pubdeploy/.github/workflows/k8s-deploy.yml@fc34f05c790732a1ea831d896e557e9f816cba50 # v0.5.0
    with:
      image: ghcr.io/sustenaut/dashboard
      deploys: k8s dashboard DEPLOY_DASHBOARD
      # The image starts as its own user without node_modules, serves its health check with
      # placeholder settings, and refuses to start without them.
      check: |
        docker run --rm "$IMAGE" sh -c 'test "$(id -u)" = 1000 && test ! -e node_modules && test -f public/app.css'
        docker run -d --name app -p 8080:8080 -e DASHBOARD_APP_ID=1 -e DASHBOARD_APP_KEY=x \
          -e DASHBOARD_CLIENT_ID=x -e DASHBOARD_CLIENT_SECRET=x \
          -e DASHBOARD_SESSION_SECRET=check-only-session-secret-0123456789 "$IMAGE"
        for _ in $(seq 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
        curl -fs localhost:8080/ | grep -q 'Sign in to Sustenaut'
        docker rm -f app
        ! docker run --rm "$IMAGE" 2>/dev/null
    secrets: inherit
